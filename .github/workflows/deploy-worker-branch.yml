name: Deploy Oracle Worker (branch)

# Deploys THIS branch to worker 1 when a push's commit message contains
# [deploy-worker], or prints VM diagnostics only (no restart) when it
# contains [diagnose-worker]. Push-triggered because workflow_dispatch
# needs actions:write, which the integration driving these sessions may
# not have. Deploying main via the normal push-to-main workflow restores
# the box afterwards.
on:
  push:
    branches: ['claude/worker-thread-subagents-ebdmzl']

jobs:
  deploy-branch:
    if: contains(github.event.head_commit.message, '[deploy-worker]') || contains(github.event.head_commit.message, '[diagnose-worker]')
    runs-on: ubuntu-latest
    env:
      # The diagnose tag WINS whenever present — mentioning the deploy tag in
      # prose elsewhere in a message must never cause a surprise restart
      # (exactly that happened on this workflow's first run).
      DIAG_ONLY: ${{ contains(github.event.head_commit.message, '[diagnose-worker]') }}
      DEPLOY_REF: ${{ github.ref_name }}
    steps:
      - name: Deploy ${{ github.ref_name }} to worker 1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 15m
          envs: DIAG_ONLY,DEPLOY_REF
          script: |
            set -e
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"

            echo "══════════ DIAGNOSTICS (before) ══════════"
            echo "bun: $(bun --version 2>/dev/null || echo MISSING)"
            echo "node: $(node --version 2>/dev/null || echo MISSING)"
            echo "deployed commit: $(git -C /opt/palmkit-worker rev-parse --short HEAD 2>/dev/null || echo unknown)"
            echo "service: $(systemctl is-active palmkit-worker 2>/dev/null || echo unknown)"
            echo "mem: $(free -m | awk '/Mem:/{print $3"/"$2" MB"}')"
            echo "disk: $(df -h /opt | awk 'NR==2{print $3"/"$2" used"}')"
            echo "── last 60 service log lines ──"
            sudo journalctl -u palmkit-worker -n 60 --no-pager -o cat || true

            if [ "$DIAG_ONLY" = "true" ]; then
              echo "[diagnose-worker] only — skipping deploy."
              exit 0
            fi

            echo "══════════ DEPLOY $DEPLOY_REF ══════════"
            cd /opt/palmkit-worker
            git fetch origin "+refs/heads/$DEPLOY_REF:refs/remotes/origin/$DEPLOY_REF"
            git checkout -f "origin/$DEPLOY_REF" --detach
            echo "now at: $(git rev-parse --short HEAD) — $(git log -1 --format=%s)"

            cd /opt/palmkit-worker/external-worker
            bun install --frozen-lockfile
            sudo systemctl restart palmkit-worker
            sleep 5
            echo "service after restart: $(systemctl is-active palmkit-worker)"
            sudo journalctl -u palmkit-worker -n 15 --no-pager -o cat || true
            echo "Deploy of $DEPLOY_REF complete ✅"
