name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # electron's node-gyp is fetched via git@github.com which fails in CI (no SSH key).
      # Rewrite all git SSH URLs to HTTPS — safe for public repos.
      - name: Configure git SSH→HTTPS rewrite
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
        continue-on-error: true # tests are partial — don't block PRs yet

  worker-quality:
    name: Worker Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure git SSH→HTTPS rewrite
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install worker dependencies
        working-directory: external-worker
        run: bun install --frozen-lockfile

      - name: Typecheck worker
        working-directory: external-worker
        run: bun run typecheck
