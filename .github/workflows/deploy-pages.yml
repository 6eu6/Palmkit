name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'external-worker/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Prevent concurrent production deploys — the latest push wins.
concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # electron's node-gyp is fetched via git@github.com which fails in CI (no SSH key).
      - name: Configure git SSH→HTTPS rewrite
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy build/client --project-name=mobile-ai-dev-workspace
        # This step used to be continue-on-error, from when the Cloudflare
        # secrets were not set yet. They have been set for a long time, and the
        # effect now is that a deploy which does not happen reports success —
        # which is how six commits in a row shipped nothing without anyone
        # noticing. A deploy that fails should be red.
